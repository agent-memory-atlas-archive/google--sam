[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-mesh"
version = "0.1.0"
description = "Native SDK for joining a SAM agent mesh from inside a Python agent process"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "biscuit-python>=0.4",
    "cryptography>=42",
    # HTTP/1.1 on a libp2p stream (/libp2p-http) and forwarding to a backend.
    "h11>=0.14",
    "httpx>=0.27",
    "libp2p>=0.7,<0.8",
    "mcp>=2,<3",
    "multiaddr>=0.2",
    # py-libp2p requires protobuf<7; stay co-installable.
    "protobuf>=4.25,<7",
    "trio>=0.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/google/sam"
Source = "https://github.com/google/sam/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
