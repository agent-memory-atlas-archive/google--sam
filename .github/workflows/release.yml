name: goreleaser

on:
  push:
    # run only against release tags
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Run GoReleaser
        # The mobile app is built and attached to this release by the
        # parallel "Mobile App" workflow (.github/workflows/mobile.yml).
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native SDKs (sdk/) ship with the same version as the release tag,
  # through trusted publishing: npm and PyPI accept this workflow's OIDC
  # token for the packages once an owner has registered it on each registry
  # (see sdk/README.md); no publishing secret is stored in the repository.
  # Off until that registration is done: set the repository variable
  # PUBLISH_SDKS to "true" to turn it on.
  publish-sdks:
    if: vars.PUBLISH_SDKS == 'true'
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Stamp the release version on both SDKs
        run: ./hack/sdk-version.sh "${SDK_VERSION#v}"
      - name: Build and publish @sam-mesh/sdk
        # npm's trusted publishing needs npm 11.5 or later; Node 22 ships 10.
        working-directory: sdk/js
        run: |
          npm install -g npm@latest
          npm ci
          npm run build
          npm publish --provenance --access public
      - name: Build sam-mesh
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish sam-mesh
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
