# Fly.io blueprint for running a persistent standalone SAM mesh (sam-one).
#
# Deploy in one command:
#   fly launch --copy-config --config deploy/fly/fly.toml --ha=false
#   fly logs
#
# What you get automatically:
#   - Public HTTPS + WebSocket URL: https://<your-app-name>.fly.dev
#   - 1 GB persistent volume mounted at /data (preserves SQLite DB, router PeerID,
#     join-token, and admin-token across restarts)
#   - Automatic /info wss:// address discovery from the Fly.io Host header
#   - Startup banner in `fly logs` with your URL, Admin Token, and Join Token

app = "sam-one-hub"
primary_region = "ord"

[build]
  image = "ghcr.io/google/sam-one:latest"

[env]
  PORT = "8080"

[[mounts]]
  source = "sam_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
